name: Compilar Juego iOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar herramientas de descarga
        run: |
          pip3 install gdown zstandard

      - name: Descargar Juego y Claves desde Secrets
        run: |
          # Creamos el archivo de claves secreto
          echo "${{ secrets.PROD_KEYS }}" > prod.keys
          
          # Descargamos el juego pesado saltando la advertencia de Google
          gdown --id 14vuE2yOd0CEtAkjicdK4iE9qCkrjyiUt -O juego.nsp

      - name: Ejecutar Conversor Nxnative
        run: |
          python3 nxnative.py --input juego.nsp --keys prod.keys --platform ios

      - name: Generar ejecutable IPA con Xcode
        run: |
          xcodebuild -project nxnative.xcodeproj -scheme "nxnative-iOS" -configuration Release -sdk iphoneos DEPLOYMENT_LOCATION=YES

      - name: Subir Archivo IPA Terminado
        uses: actions/upload-artifact@v4
        with:
          name: juego-ios-compilado
          path: build/*.ipa
